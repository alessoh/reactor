<style>
  body { margin:0; background:#fff; font-family: Inter, "Segoe UI", Arial, sans-serif; }
  .wrap { width:900px; padding:12px 10px; }
</style>
<div class="wrap">
<svg viewBox="0 0 900 322" width="900" height="322" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="d" markerWidth="7" markerHeight="7" refX="3.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a4741"/>
    </marker>
    <marker id="ds" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#4a4741"/>
    </marker>
  </defs>

  <!-- ============ Rectangular parallelepiped ============ -->
  <g transform="translate(40,40)">
    <text x="105" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">
      Rectangular parallelepiped
    </text>
    <!-- box -->
    <path d="M40,50 h110 v110 h-110 z" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.6"/>
    <path d="M40,50 l34,-30 h110 l-34,30 z" fill="#f3faf9" stroke="#0f766e" stroke-width="1.3"/>
    <path d="M150,50 l34,-30 v110 l-34,30 z" fill="#d6eae7" stroke="#0f766e" stroke-width="1.3"/>
    <!-- dims -->
    <path d="M40,178 H150" stroke="#4a4741" stroke-width="1" marker-start="url(#ds)" marker-end="url(#d)"/>
    <text x="95" y="193" text-anchor="middle" font-size="11" fill="#4a4741">a (x)</text>
    <path d="M26,50 V160" stroke="#4a4741" stroke-width="1" marker-start="url(#ds)" marker-end="url(#d)"/>
    <text x="14" y="110" text-anchor="middle" font-size="11" fill="#4a4741">c (z)</text>
    <path d="M158,42 L190,14" stroke="#4a4741" stroke-width="1" marker-start="url(#ds)" marker-end="url(#d)"/>
    <text x="192" y="16" font-size="11" fill="#4a4741">b (y)</text>
    <!-- formula -->
    <rect x="0" y="208" width="210" height="62" rx="6" fill="#f0eee8" stroke="#cbc7ba"/>
    <text x="105" y="229" text-anchor="middle" font-size="12.5" font-weight="600">
      B&#178; = (&#960;/a)&#178; + (&#960;/b)&#178; + (&#960;/c)&#178;
    </text>
    <text x="105" y="249" text-anchor="middle" font-size="11" fill="#4a4741">
      V<tspan font-size="8.5" dy="2.5">min</tspan><tspan dy="-2.5"> = </tspan>(148/B)&#179;
    </text>
    <text x="105" y="263" text-anchor="middle" font-size="10" fill="#7d786e">largest critical mass</text>
  </g>

  <!-- ============ Cylinder ============ -->
  <g transform="translate(345,40)">
    <text x="105" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">
      Cylinder
    </text>
    <path d="M56,40 h98 v120 h-98 z" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.6"/>
    <ellipse cx="105" cy="40" rx="49" ry="15" fill="#f3faf9" stroke="#0f766e" stroke-width="1.5"/>
    <path d="M56,160 a49,15 0 0 0 98,0" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    <path d="M105,40 H154" stroke="#4a4741" stroke-width="1" marker-end="url(#d)"/>
    <text x="130" y="33" text-anchor="middle" font-size="11" fill="#4a4741">R</text>
    <path d="M170,40 V160" stroke="#4a4741" stroke-width="1" marker-start="url(#ds)" marker-end="url(#d)"/>
    <text x="180" y="104" font-size="11" fill="#4a4741">H</text>
    <rect x="0" y="208" width="210" height="62" rx="6" fill="#f0eee8" stroke="#cbc7ba"/>
    <text x="105" y="229" text-anchor="middle" font-size="12.5" font-weight="600">
      B&#178; = (2.405/R)&#178; + (&#960;/H)&#178;
    </text>
    <text x="105" y="249" text-anchor="middle" font-size="11" fill="#4a4741">
      V<tspan font-size="8.5" dy="2.5">min</tspan><tspan dy="-2.5"> = </tspan>(161/B)&#179;
    </text>
    <text x="105" y="263" text-anchor="middle" font-size="10" fill="#7d786e">optimum at H = 1.847 R</text>
  </g>

  <!-- ============ Sphere ============ -->
  <g transform="translate(650,40)">
    <text x="105" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">
      Sphere
    </text>
    <circle cx="105" cy="100" r="60" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.6"/>
    <ellipse cx="105" cy="100" rx="60" ry="19" fill="none" stroke="#0f766e" stroke-width="0.9" opacity="0.55"/>
    <path d="M105,100 L162,82" stroke="#4a4741" stroke-width="1" marker-end="url(#d)"/>
    <text x="140" y="78" font-size="11" fill="#4a4741">R</text>
    <circle cx="105" cy="100" r="2.4" fill="#4a4741"/>
    <rect x="0" y="208" width="210" height="62" rx="6" fill="#f0eee8" stroke="#cbc7ba"/>
    <text x="105" y="229" text-anchor="middle" font-size="12.5" font-weight="600">
      B&#178; = (&#960;/R)&#178;
    </text>
    <text x="105" y="249" text-anchor="middle" font-size="11" fill="#4a4741">
      V<tspan font-size="8.5" dy="2.5">min</tspan><tspan dy="-2.5"> = </tspan>(130/B)&#179;
    </text>
    <text x="105" y="263" text-anchor="middle" font-size="10" fill="#7d786e">smallest critical mass</text>
  </g>
</svg>
</div>
